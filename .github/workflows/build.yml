name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: 构建
        run: gradle fatJar --no-daemon

      - name: 启动模式自检
        run: |
          set -e
          jar=build/dist/HMCL-Uncut-Patcher.jar
          java -jar "$jar" --version | grep -Eq '^HMCL-Uncut-Patcher [0-9]+\.[0-9]+\.[0-9]+$'
          echo "版本输出正常"

          set +e
          java -Djava.awt.headless=true -jar "$jar" > noargs.log 2>&1
          status=$?
          set -e
          echo "无参数 + 无界面：exit=$status，输出 $(wc -c < noargs.log) 字节"
          cat noargs.log
          [ "$status" -eq 2 ]
          grep -q 'java -jar HMCL-Uncut-Patcher.jar' noargs.log

          set +e
          java -Djava.awt.headless=true -jar "$jar" --gui > gui.log 2>&1
          status=$?
          set -e
          echo "--gui + 无界面：exit=$status，输出 $(wc -c < gui.log) 字节"
          cat gui.log
          [ "$status" -eq 2 ]

          echo "启动模式自检通过"

      - name: 端到端自检
        run: |
          set -e
          jar=build/dist/HMCL-Uncut-Patcher.jar
          curl -fsSL -o hmcl.jar https://github.com/HMCL-dev/HMCL/releases/download/v3.17.0.362/HMCL-3.17.0.362.jar
          echo "官方 jar：$(sha256sum hmcl.jar)"
          java -jar "$jar" hmcl.jar -o hmcl-uncut.jar
          mkdir -p verify
          (cd verify && jar xf ../hmcl-uncut.jar org/jackhuang/hmcl/util/RegionUtils.class)
          javap -p -c verify/org/jackhuang/hmcl/util/RegionUtils.class \
            | grep -A3 'isIsChinaMainlandNetwork' | grep -q iconst_0
          echo "字节码检查通过"
          if java -jar "$jar" hmcl-uncut.jar -o never.jar; then
            echo "已打过补丁的文件没有被拒绝"; exit 1
          fi
          echo "重复补丁拒绝测试通过"

      - name: 生成校验和
        run: |
          set -e
          cp build/dist/HMCL-Uncut-Patcher.jar .
          sha256sum HMCL-Uncut-Patcher.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HMCL-Uncut-Patcher
          path: |
            HMCL-Uncut-Patcher.jar
            SHA256SUMS.txt
          archive: false
          if-no-files-found: error
